# 禁用 OnlyOffice Service Worker（20260815 实测）
# 浏览器端 SW fetch 在 localhost 跨端口场景抛 Failed to fetch，导致编辑器 iframe 404/下载失败白屏；
# 服务端资源本身 200，禁用 SW 后资源走普通网络请求即正常。
# SW 注册路径带版本前缀（如 /9.4.0-xxx/document_editor_service_worker.js），需同时拦截两种形态。
location ~ ^/[0-9a-zA-Z.-]+/document_editor_service_worker\.js$ {
    return 403;
}
location = /document_editor_service_worker.js {
    return 403;
}
