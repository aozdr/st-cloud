# 星云盘多节点入口：普通 API 轮询，中转上传按 uploadId 粘滞，流式接口关闭缓冲。

upstream stcloud_api {
    least_conn;
    server app1:8080 max_fails=2 fail_timeout=10s;
    server app2:8080 max_fails=2 fail_timeout=10s;
    keepalive 64;
}

# 中转上传的临时文件与会话在节点本地：同一 uploadId 必须固定到同一节点。
# init 不带 uploadId，因此服务端改为「首个 relay-chunk 惰性创建缓冲」。
upstream stcloud_relay {
    hash $arg_uploadId consistent;
    server app1:8080 max_fails=2 fail_timeout=10s;
    server app2:8080 max_fails=2 fail_timeout=10s;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10g;
    client_body_timeout 300s;

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 默认关闭上游长连接复用；WebSocket 位置会显式改为 upgrade。
    # 注意：location 内一旦出现 proxy_set_header，就不再继承本层配置，
    # 因此需要改 header 的 location 必须把 Host 等一并重复声明。
    proxy_set_header Connection "";

    root /usr/share/nginx/html;

    # 入口与 Service Worker 不缓存：发布后立即拿到新的 hash 资源，避免旧 index 引用已删除的旧 chunk
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    # 带 hash 的静态资源长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 中转上传：按 uploadId 粘滞；关闭请求缓冲，服务端 pacing 才真正生效；
    # 关闭 next_upstream，避免 POST 被重放到没有临时文件的节点。
    location ~ ^/api/file/upload/relay-(chunk|finalize)$ {
        proxy_pass http://stcloud_relay;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_next_upstream off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 同步 WebSocket：握手升级 + 长连接
    location = /api/sync/ws {
        proxy_pass http://stcloud_api;
        # 该 location 覆盖了 proxy_set_header，必须重复声明 Host 等头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 流式下载 / 预览 / 缩略图：不缓冲，Range 透传
    location ~ ^/api/(file/[0-9]+/stream|share/access/stream/|share/access/thumbnail/) {
        proxy_pass http://stcloud_api;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ZIP 打包下载同样是服务端 pacing 的流式响应，不能缓冲
    location = /api/file/download/zip {
        proxy_pass http://stcloud_api;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 普通 API
    location /api/ {
        proxy_pass http://stcloud_api;
        proxy_read_timeout 120s;
    }
}
