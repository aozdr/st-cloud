version: '3.8'

services:
  # MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: stcloud-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: stcloud
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password

  # Redis 7
  redis:
    image: redis:7-alpine
    container_name: stcloud-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ""

  # RustFS (S3 兼容对象存储)
  rustfs:
    image: rustfs/rustfs:latest
    container_name: stcloud-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: stcloud
      RUSTFS_SECRET_KEY: stcloud123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data

  # RocketMQ NameServer
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: stcloud-rocketmq-namesrv
    restart: unless-stopped
    ports:
      - "9876:9876"
    command: sh mqnamesrv

  # RocketMQ Broker
  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: stcloud-rocketmq-broker
    restart: unless-stopped
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    depends_on:
      - rocketmq-namesrv
    environment:
      NAMESRV_ADDR: "rocketmq-namesrv:9876"
    command: sh -c "echo 'brokerIP1 = 127.0.0.1' >> /home/rocketmq/rocketmq-5.3.1/conf/broker.conf && echo 'namesrvAddr = rocketmq-namesrv:9876' >> /home/rocketmq/rocketmq-5.3.1/conf/broker.conf && echo 'autoCreateTopicEnable = true' >> /home/rocketmq/rocketmq-5.3.1/conf/broker.conf && sh mqbroker -c /home/rocketmq/rocketmq-5.3.1/conf/broker.conf"

  # RocketMQ Dashboard (可选)
  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:1.0.0
    container_name: stcloud-rocketmq-dashboard
    restart: unless-stopped
    ports:
      - "9080:8080"
    depends_on:
      - rocketmq-namesrv
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876"

  # Elasticsearch 8.x (全文搜索 + 文档解析)
  elasticsearch:
    build:
      context: ./elasticsearch
      dockerfile: Dockerfile
    container_name: stcloud-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # OnlyOffice Document Server（在线文档编辑，社区版，2 核 2GB 起）
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: stcloud-onlyoffice
    restart: unless-stopped
    # 持久化修复：首次启动/空 Data 卷时先创建 certs 目录，避免启动脚本 find 报
    # "find: '/var/www/onlyoffice/Data/certs': No such file or directory"（20260815 实测）
    entrypoint: ["/bin/bash", "-c", "mkdir -p /var/www/onlyoffice/Data/certs && exec /app/ds/run-document-server.sh"]
    environment:
      JWT_ENABLED: "true"
      # 与后端 STCLOUD_ONLYOFFICE_SECRET 保持一致（HS256 至少 32 字节）；开发默认值便于开箱即用，生产用环境变量覆盖
      JWT_SECRET: ${STCLOUD_ONLYOFFICE_SECRET:-stcloud-onlyoffice-dev-secret-0123456789}
      # 回调签名令牌同时放入请求体 token 字段，后端据此验签
      JWT_IN_BODY: "true"
      JWT_HEADER: "Authorization"
    ports:
      - "8081:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_cache:/var/lib/onlyoffice
      - onlyoffice_db:/var/lib/postgresql
      # 禁用 OnlyOffice Service Worker（浏览器 SW fetch 异常导致编辑器白屏，20260815 实测）
      - ./onlyoffice/nginx/disable-sw.conf:/etc/nginx/includes/ds-disable-sw.conf:ro

volumes:
  mysql_data:
  redis_data:
  rustfs_data:
  es_data:
  onlyoffice_data:
  onlyoffice_logs:
  onlyoffice_cache:
  onlyoffice_db:
