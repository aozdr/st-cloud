  "taskId": "20260912-second-review-fix",
  "scale": "large",
  "status": "incomplete",
  "goal": {
    "objective": "严格按 st-cloud 第二轮 Review 修复计划的 Phase 1→7 顺序，关闭 P0/P1 哈希、同名 scope、Upload Init 事务、UploadSession 状态机、回收站幂等和 Archive 输入上限问题，并完成真实回归验证。",
    "scope": {
      "include": [
        "st-web upload hash",
        "st-desktop upload hash",
        "st-core upload/file/recycle/archive",
        "必要的 st-team 调用与测试",
        "本轮 .ai 文档与证据",
        "用户追加 Desktop 上传/下载 createTask SQL 修复"
      ],
      "exclude": [
        "UI 视觉",
        "FileServiceImpl 大拆分",
        "微服务化",
        "SHA-256",
        "无关重构",
        "自动清理存量冲突",
        "未经确认的公开 API/schema/migration"
      ]
    },
    "completionCriteria": [
      "Web/Desktop 使用完整文件 MD5，采样 hash 不再作为 fileMd5/秒传依据",
      "个人 owner 与团队 space 的同名检查完整隔离且同 scope 仍冲突",
      "Upload Init 的 node/session/chunks/version DB 写入原子回滚，S3 init/abort 在事务外",
      "UploadSession 使用 CAS 权威状态机，merge/abort 真实并发测试通过",
      "回收站 root-only 与重复 permanentDelete 不重复退 quota/ref/object",
      "Archive ZIP 输入流受 maxArchiveInputSize 限制并清理临时文件",
      "计划要求的 backend、team、Web、Desktop、schema 和 git 门禁有真实证据",
      "无新增未批准的 P0/P1，最终报告列出所有遗留 P0/P1/P2 风险"
    ]
  },
