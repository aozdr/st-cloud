taskId: "20260813-upload-rate-throttle"
goal:
  objective: "实现上传限速低于分片下限场景的服务端中转限速：当有效限速值低于分片大小(5MB)时上传改走服务端中转路径，服务端逐块节流接收并缓冲，攒够 multipart 分片下限后写入 S3，实现瞬时速率限速而非分片粒度突发"
  scope: "st-common 限速器 + st-core 上传服务/控制器 + st-web 上传 hook + st-desktop 上传管理器"
  completionCriteria:
    - "低速率(rate<5MB)上传走服务端中转，瞬时速率不超限速值"
    - "正常速率(rate>=5MB 或不限速)保持 presigned 直传，行为不变"
    - "客户端自限速场景同样实现真实节流"
    - "临时文件缓冲生命周期完整管理，无泄漏"
    - "H2 测试全绿 + 后端编译 + 前端构建通过"
