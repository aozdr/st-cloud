taskId: "20260815-sync-refactor"
goal:
  objective: "重构同步引擎，消除同步死循环与冲突文件自生成；建立版本号+最后同步时间门控的全量同步；清理已产生的机器格式垃圾副本（含 S3 物理对象）"
  scope: "st-desktop（sync-engine/database/db-migrate/sync-utils/file-watcher 相关）+ st-sync/st-core（服务端守卫与清理接口）+ 清理脚本 + 文档与知识库"
  completionCriteria:
    - "打开应用不再无条件全量对账；版本不一致或 last_sync_at 为空才全量重建一次，且全量成功才固化版本"
    - "keep_both 冲突只产生两份副本并一次登记，不回流上传/删除；连续多轮日志无新增操作"
    - "sync_state 局部更新不再擦除 local_mtime（合并语义）"
    - "服务端不再产生 old==new 的 MOVE/RENAME 脏日志（源头守卫 + delta 兜底过滤）"
    - "构建测试通过：tsc/npm test/build:main 全绿；mvn -pl st-sync -am compile 通过"
    - "异常数据清理接口与脚本可用（数据库 + S3 物理对象，dry-run/apply）"
scale: medium
tasks:
  - { id: TASK-20260815-sync-refactor-01, name: "同步引擎 V2 重构（桌面端+服务端+清理脚本）", status: done, ref: ".ai/tasks/TASK-20260815-sync-refactor-01.md", changereport: ".ai/docs/20260815-sync-refactor/changereport.md", adr: ".ai/decisions/ADR/ADR-009-sync-engine-v2.md" }
