    action: "用户实测 Office 历史版本提示不支持 → 改判 P1，实现 Office 历史版本 OnlyOffice 只读预览"
    delta: "editor/config 增加可选 versionId；版本令牌带 versionId 声明由 /stream 返回版本对象；配置只读且无 callbackUrl；前端 Office 版本预览跳编辑器只读页"
    result: "mvn -pl st-core,st-preview -am test 通过（196 用例）、npm run build 通过；docservice 运行期行为待用户环境实测"
