taskId: "20260910-version-preview"
goal:
  objective: "为星云盘文件历史版本提供在线预览能力：用户可直接查看指定历史版本内容，无需恢复即可比对，且不改变当前版本"
  scope: "st-preview 新增版本预览端点与分派逻辑、st-web 历史版本弹窗与预览弹窗版本模式；st-core 仅复用不改动；无数据库变更"
  completionCriteria:
    - "登录用户可通过历史版本弹窗预览指定版本（图片/视频/音频/文本/PDF）"
    - "预览历史版本不读取、不改动当前版本，且不写最近文件"
    - "版本归属与节点可访问性双重校验，跨文件/跨租户 versionId 不可预览"
    - "Office 及其它不支持类型返回明确提示，不跳转 OnlyOffice"
    - "后端集成测试覆盖正常预览、版本不存在、版本不属于该文件、无权限"
    - "前端构建通过，现有当前版本预览无回归"
scale: medium
exitCriteria:
  - id: DESIGN
    desc: "设计已定；design.md 经 Grill Me 拷打收敛（遗留问题点<=3 写入文档）并经用户确认"
    status: done
    dependsOn: []
  - id: TESTCASES
    desc: "验收用例已编写"
    status: done
    dependsOn: [DESIGN]
  - id: IMPLEMENTED
    desc: "代码已实现"
    status: done
    dependsOn: [DESIGN, TESTCASES]
  - id: CODE_REVIEW
    desc: "Code Review 通过"
    status: done
    dependsOn: [IMPLEMENTED]
  - id: SECURITY_REVIEW
    desc: "安全审查通过（条件项：涉及文件访问与越权防护，激活）"
    status: done
    dependsOn: [IMPLEMENTED]
  - id: TEST_PASS
    desc: "测试通过"
    status: done
    dependsOn: [CODE_REVIEW, SECURITY_REVIEW]
  - id: KNOWLEDGE
    desc: "知识库已回顾"
    status: done
    dependsOn: [TEST_PASS]
  - id: ACCEPT
    desc: "验收通过（对照完成标准逐项核对）"
    status: done
    dependsOn: [KNOWLEDGE]
artifacts:
  design:
    status: done
    ref: ".ai/docs/20260910-version-preview/design.md"
    owner: "executor"
    grillPoints:
      - "P1: 已裁决 -> 仅支持图片/视频/音频/文本/PDF，Office 提示不支持，不跳 OnlyOffice"
      - "P2: 已裁决 -> 仅非当前版本显示预览入口"
      - "P3: 已裁决 -> 本次不做下载历史版本"
    userConfirmedAt: "2026-09-10"
  testcases: { status: done, ref: ".ai/docs/20260910-version-preview/testcases.md", owner: "tester" }
  code: { status: done, ref: "", owner: "executor" }
  review: { status: done, ref: ".ai/docs/20260910-version-preview/codereview.md", owner: "reviewer" }
  security: { status: done, ref: ".ai/docs/20260910-version-preview/security.md", owner: "reviewer" }
  testReport: { status: done, ref: ".ai/docs/20260910-version-preview/testreport.md", owner: "tester" }
  knowledge: { status: done, ref: ".ai/docs/20260910-version-preview/knowledge.md", owner: "executor" }
  task: { status: done, ref: ".ai/tasks/TASK-20260910-version-preview-01.md", owner: "workflow-manager" }
  changereport: { status: done, ref: ".ai/docs/20260910-version-preview/changereport.md", owner: "executor" }
blockers: []
