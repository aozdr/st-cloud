taskId: "20260815-onlyoffice-editor"
goal:
  objective: "基于 OnlyOffice 社区版为星云盘新增在线文档编辑（docx/xlsx/pptx 编辑 + 只读预览），复用现有权限、版本、事件体系，不引入付费组件"
  scope: "st-core（编辑器配置/回调端点）+ st-web（编辑器页面/路由）+ docker-compose（OnlyOffice 容器）+ st-api 配置；禁止改动分享/团队权限模型表结构"
  completionCriteria:
    - "支持 docx/xlsx/pptx 在线编辑与保存，保存后生成 file_version 并可回滚"
    - "权限映射正确：具备上传/编辑能力的用户可编辑，其余只读；回调经安全校验，杜绝越权覆盖文件"
    - "编辑期间禁止删除/移动/重命名该文件；多人协同编辑不丢数据"
    - "docker-compose 一键部署 OnlyOffice 社区版容器，支持外部实例地址配置"
    - "构建测试通过：mvn test + npm run build"
scale: large
tasks: []
exitCriteria:
  - { id: REQ_ANALYSIS, desc: "需求已分析 + requirement.md 产出（Grill Me 收敛 ≤3 问题点写入文档）并经用户确认", status: done, dependsOn: [] }
  - { id: IMPACT_ANALYSIS, desc: "影响范围已分析", status: done, dependsOn: [REQ_ANALYSIS] }
  - { id: EXP_DESIGN, desc: "体验评审已通过", status: done, dependsOn: [REQ_ANALYSIS] }
  - { id: TECH_DESIGN, desc: "技术设计已评审；design.md 经 Grill Me 收敛并经用户确认", status: done, dependsOn: [IMPACT_ANALYSIS, EXP_DESIGN] }
  - { id: TESTCASES, desc: "测试用例已编写", status: done, dependsOn: [TECH_DESIGN] }
  - { id: IMPLEMENTED, desc: "实现阶段已完成", status: done, dependsOn: [TECH_DESIGN, TESTCASES] }
  - { id: CODE_REVIEW, desc: "Code Review 通过", status: done, dependsOn: [IMPLEMENTED] }
  - { id: SECURITY_REVIEW, desc: "Security Review 通过（涉及回调校验/越权/文件写入，必开）", status: done, dependsOn: [IMPLEMENTED] }
  - { id: EXP_ACCEPT, desc: "体验验收通过", status: done, dependsOn: [IMPLEMENTED] }
  - { id: TEST_PASS, desc: "测试执行通过", status: done, dependsOn: [CODE_REVIEW, SECURITY_REVIEW] }
  - { id: KNOWLEDGE, desc: "知识库已更新", status: done, dependsOn: [TEST_PASS, SECURITY_REVIEW, EXP_ACCEPT] }
  - { id: ACCEPT, desc: "验收通过（最终收敛点）", status: done, dependsOn: [KNOWLEDGE] }
