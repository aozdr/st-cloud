  knowledge: { status: done, ref: "architecture/api-reference/frontend/business-domain/project-overview", owner: "knowledge-manager" }
  changereport: { status: done, ref: ".ai/docs/20260815-onlyoffice-editor/changereport.md", owner: "executor" }
