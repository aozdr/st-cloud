# Agent Loop 退出标准（当前新任务的唯一事实源）
# V2 定义冻结在 exit-criteria.v2.yaml，仅用于旧 State 的兼容校验。
version: 3
updated: "2026-10-01"

scales:
  small:
    label: "小型（默认对话内直接完成，显式审计才初始化 State）"
    criteria:
      - id: IMPLEMENTED
        dependsOn: []
      - id: VERIFIED
        dependsOn: [IMPLEMENTED]
      - id: KNOWLEDGE
        dependsOn: [VERIFIED]
      - id: ACCEPT
        dependsOn: [KNOWLEDGE]
  medium:
    label: "中型（默认主线程执行）"
    criteria:
      - id: DESIGN
        dependsOn: []
      - id: IMPLEMENTED
        dependsOn: [DESIGN]
      - id: VERIFIED
        dependsOn: [IMPLEMENTED]
      - id: ACCEPT
        dependsOn: [VERIFIED]
  large:
    label: "大型或高风险（保留独立评审）"
    criteria:
      - id: REQ_ANALYSIS
        dependsOn: []
      - id: TECH_DESIGN
        dependsOn: [REQ_ANALYSIS]
      - id: IMPLEMENTED
        dependsOn: [TECH_DESIGN]
      - id: CODE_REVIEW
        dependsOn: [IMPLEMENTED]
      - id: VERIFIED
        dependsOn: [IMPLEMENTED]
      - id: ACCEPT
        dependsOn: [CODE_REVIEW, VERIFIED]

catalog:
  REQ_ANALYSIS:
    desc: "目标、用户场景、边界、业务规则、异常与验收已明确；只有未决实质决策需确认"
    owner: executor
    taskType: requirement
    artifacts: [requirement.md]
    userConfirm: true
    conditional: true
  TECH_DESIGN:
    desc: "设计覆盖影响、兼容、迁移、回滚、UI（适用时）与测试计划；必要决策已确认"
    owner: executor
    taskType: design
    artifacts: [design.md]
    userConfirm: true
    conditional: true
  DESIGN:
    desc: "精简设计含目标、范围、方案、风险、验收与测试计划；必要决策已确认"
    owner: executor
    taskType: design
    artifacts: [design.md]
    userConfirm: true
    conditional: true
  IMPLEMENTED:
    desc: "TASK 范围内实现完成；变更说明在 verification.md 汇总，无需另派实现完成检查"
    owner: executor
    taskType: implement
    artifacts: []
  CODE_REVIEW:
    desc: "独立审查代码、权限、安全、数据一致性和适用风险；不得由实现者自检代替"
    owner: reviewer
    taskType: review
    artifacts: [codereview.md]
  VERIFIED:
    desc: "当前修订的相称验证、自检和知识同步完成；risk 触发的 UI/安全/DB/API/不可逆维度均有证据"
    owner: executor
    taskType: test
    artifacts: [verification.md]
  KNOWLEDGE:
    desc: "仅用于显式 small 审计；稳定规则按需同步，无变化记录原因"
    owner: executor
    taskType: knowledge
    artifacts: []
  ACCEPT:
    desc: "主线程逐项核对 Goal，当前修订证据完整、无 blocker 和未结束派发"
    owner: executor
    taskType: accept
    artifacts: []

# 只有高风险独立评审要求身份分离；测试、知识同步和最终核验由主线程负责。
separationOfDuty:
  producers: [IMPLEMENTED]
  verifiers: [CODE_REVIEW]
  field: "by"
  rule: "CODE_REVIEW 必须由独立 reviewer 完成，V3 不接受单人授权绕过"

stateStatus:
  allowed: [running, blocked_escalation, done, incomplete, abandoned]
  doneRequires: "所有标准完成；产物和逐项 Goal 证据真实且匹配当前 revision，无 blocker/未结束 dispatch"
  incomplete: "完成态校验发现缺口，定向补齐"
  abandoned: "用户取消或明确不再继续"
