@keyframes toast-slide-down {
  from { opacity: 0; transform: translateY(-12px); }
  to { opacity: 1; transform: translateY(0); }
}
.animate-toast-slide-down {
  animation: toast-slide-down 0.2s ease-out;
}

@keyframes dialog-pop {
  from { opacity: 0; transform: scale(0.95) translateY(8px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.animate-dialog-pop {
  animation: dialog-pop 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes toast-progress {
  from { width: 100%; }
  to { width: 0%; }
}
.animate-toast-progress {
  animation: toast-progress 3s linear forwards;
}

@keyframes pulse-warning {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}
.animate-pulse-warning {
  animation: pulse-warning 2s ease-in-out infinite;
}

@keyframes file-enter {
  from { opacity: 0; }
  to { opacity: 1; }
}
.animate-file-enter {
  animation: file-enter 0.32s cubic-bezier(0.16, 1, 0.3, 1) both;
}

/* 不确定进度条：解压/上传等无法预知总进度的耗时操作使用 */
@keyframes progress-indeterminate {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(250%); }
}
.animate-progress-indeterminate {
  animation: progress-indeterminate 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}

@keyframes skeleton-pulse {
  0%, 100% { opacity: 0.45; }
  50% { opacity: 0.8; }
}
.shimmer {
  background: linear-gradient(90deg, rgb(var(--surface-2)) 25%, rgb(var(--border)) 50%, rgb(var(--surface-2)) 75%);
  background-size: 200% 100%;
  /* 柔和呼吸：不用左右滑过高光，避免闪眼 */
  opacity: 0.6;
  animation: skeleton-pulse 1.8s ease-in-out infinite;
}

/* 传输进度条光泽流动：仅活跃任务进度条启用，传达"正在推进"的运动感 */
@keyframes progress-sheen {
  0% { transform: translateX(-120%); }
  100% { transform: translateX(320%); }
}
.progress-sheen {
  position: relative;
  overflow: hidden;
}
.progress-sheen::after {
  content: '';
  position: absolute;
  top: 0;
  bottom: 0;
  width: 36%;
  background: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.5), transparent);
  animation: progress-sheen 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}

@keyframes route-fade {
  from { opacity: 0; }
  to { opacity: 1; }
}
.animate-route-fade {
  animation: route-fade 0.24s cubic-bezier(0.16, 1, 0.3, 1) both;
}

/* 品牌渐变区始终深色：hero banner / login 背景，不跟随 light/dark 切换 */
.brand-gradient {
  background:
    radial-gradient(ellipse at 20% 0%, rgb(var(--color-primary-500) / 0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgb(var(--color-primary-500) / 0.10) 0%, transparent 50%),
    rgb(var(--bg));
}

/* PikPak 风浅灰侧边栏：浅色模式下浅灰底+深色文字 */
.sidebar-gradient {
  background: rgb(var(--surface));
  border-right: 1px solid rgb(var(--border));
}

  @media (prefers-reduced-motion: reduce) {
    /* 无障碍：动画豁免仅缩短 transition，keyframes 类动画全部停用 */
    .animate-fade-in,
    .animate-scale-in,
    .animate-slide-up,
    .animate-file-enter,
    .animate-route-fade,
    .animate-dialog-pop,
    .animate-toast-slide-down,
    .animate-toast-progress,
    .animate-pulse-warning,
    .animate-sheet-up,
    .animate-sheet-down,
    .animate-progress-indeterminate,
    .shimmer,
    .progress-sheen::after {
      animation: none !important;
    }
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    animation-delay: 0s !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* ===== 移动端 ActionSheet 动画 ===== */
@keyframes sheet-up {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.animate-sheet-up {
  animation: sheet-up 0.28s cubic-bezier(0.16, 1, 0.3, 1) both;
}
@keyframes sheet-down {
  from { transform: translateY(0); }
  to { transform: translateY(100%); }
}
.animate-sheet-down {
  animation: sheet-down 0.2s ease-in both;
}

/* ===== 移动端: 禁用文本选择(长按不选中文本) ===== */
@media (max-width: 767px) {
  .no-select-mobile {
    -webkit-user-select: none;
    -moz-user-select: none;
         user-select: none;
    -webkit-touch-callout: none;
  }
}

/* ===== 桌面端顶部标题栏（配合 Electron titleBarStyle: hidden + titleBarOverlay） =====
   颜色跟随设计 Token：浅色白底深字、深色深底浅字，与 Windows 三键 overlay 一致 */
.app-titlebar {
  height: 36px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  padding-left: 12px;
  padding-right: 140px; /* 给系统最小化/最大化/关闭按钮留位 */
  border-top-left-radius: 16px; /* PC 端：与侧栏右缘圆角对齐（文件区域与侧栏分割线圆角化） */
  background: rgb(var(--surface));
  color: rgb(var(--fg));
  /* 与下方区域的分割线透明，视觉上无缝衔接 */
  border-bottom: 1px solid transparent;
  -webkit-app-region: drag;
  -webkit-user-select: none;
     -moz-user-select: none;
          user-select: none;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.5px;
}

/* 详情打开：文件列表容器变窄时，网格改用自适应列数（卡片保留最小宽度），避免挤压；默认样式由 grid-cols-* 保持 */
