<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>悬浮窗菜单</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
    :root {
      --primary: #4c6ef5;
      --primary-deep: #3b5bdb;
      --bg: #ffffff;
      --bg-soft: #f5f6fa;
      --border: #e8eaf0;
      --text: #2b2f3a;
      --text-2: #8b90a0;
      --red: #f04438;
      font-size: 12px;
    }
    :root.dark {
      --primary: #6c8cff;
      --primary-deep: #5b7bf0;
      --bg: #16161a;
      --bg-soft: #1f1f26;
      --border: #2a2a30;
      --text: #e6e7eb;
      --text-2: #969ba6;
      --red: #f87171;
      color-scheme: dark;
    }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--text);
    }
    button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }
    input { font-family: inherit; }

    .card {
      position: absolute;
      left: 8px; right: 8px; top: 8px; bottom: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      /* 透明窗口内四周留白后，阴影可正常显示而不会在圆角处出现灰色边角 */
      box-shadow: 0 10px 28px rgba(30, 40, 80, 0.18);
      padding: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: none !important;
      transform: none !important;
    }

    /* ===== 菜单视图 ===== */
    .menu-view { flex: 1; display: flex; flex-direction: column; }
    /* 菜单项拉伸填满卡片：底部不再留大块空白 */
    .menu-view .menu-item { flex: 1 1 0; }
    .menu-item {
      display: flex; align-items: center; gap: 8px;
      width: 100%; padding: 8px 10px;
      border-radius: 7px; font-size: 12.5px; text-align: left;
    }
    .menu-item:hover { background: rgba(76, 110, 245, 0.08); }
    .menu-item svg { width: 14px; height: 14px; color: var(--text-2); flex-shrink: 0; }
    .menu-item.disabled { opacity: 0.45; pointer-events: none; }
    .menu-item.danger:hover { background: rgba(240, 68, 56, 0.08); }
    .menu-item.danger, .menu-item.danger svg { color: var(--red); }
    .menu-sep { height: 1px; background: var(--border); margin: 3px 6px; }

    /* ===== 简易限速设置视图（与主应用传输设置对话框一致的交互方式，可滚动） ===== */
    .settings-view {
      flex: 1; display: none; flex-direction: column;
      padding: 6px 10px; overflow-y: auto; min-height: 0;
    }
    body.settings .menu-view { display: none; }
    body.settings .settings-view { display: flex; }
    .settings-view h3 {
      font-size: 12.5px; font-weight: 700;
      margin-bottom: 6px; display: flex; align-items: center; gap: 6px;
    }
    .settings-view h3 svg { width: 14px; height: 14px; color: var(--primary); }
    .sec { padding: 8px 0; border-top: 1px solid var(--border); }
    .sec:first-of-type { border-top: none; }
    .sec-title {
      display: flex; align-items: center; gap: 6px;
      font-size: 11.5px; font-weight: 600; color: var(--text); margin-bottom: 6px;
    }
    .sec-title .sub { font-size: 10px; color: var(--text-2); font-weight: 400; }
    .parallels { display: flex; gap: 6px; }
    .parallels button {
      flex: 1; padding: 8px 0; border-radius: 8px;
      font-size: 13px; font-weight: 600;
      background: var(--bg-soft); color: var(--text-2); cursor: pointer;
    }
    .parallels button.active { background: var(--primary); color: #fff; }
    .toggle-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; cursor: pointer; }
    .switch {
      position: relative; width: 30px; height: 16px; flex-shrink: 0;
      border-radius: 10px; background: var(--primary);
      transition: background 0.15s; cursor: pointer;
    }
    .switch.off { background: rgba(76, 110, 245, 0.25); }
    .switch span {
      position: absolute; top: 2px; left: 16px;
      width: 12px; height: 12px; border-radius: 50%; background: #fff;
      transition: left 0.15s;
    }
    .switch.off span { left: 2px; }
    .toggle-label { font-size: 11px; color: var(--text-2); }
    .input-row { display: flex; align-items: center; gap: 6px; }
    .input-row input {
      flex: 1; height: 34px; min-width: 0;
      border: 1px solid var(--border); border-radius: 8px;
      padding: 0 10px; font-size: 14px; outline: none;
      background: var(--bg); color: var(--text);
      -webkit-user-select: text; user-select: text;
    }
    .input-row input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(76,110,245,0.15); }
    .unit { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex-shrink: 0; }
    .unit button {
      padding: 8px 16px; font-size: 13px; font-weight: 600;
      background: var(--bg); color: var(--text-2); cursor: pointer;
    }
    .unit button.active { background: var(--primary); color: #fff; }
    .settings-view .btns { display: flex; justify-content: flex-end; gap: 6px; padding: 8px 0 2px; }
    .btn {
      height: 26px; padding: 0 14px;
      border-radius: 7px; font-size: 12px; font-weight: 600;
    }
    .btn.primary { background: var(--primary); color: #fff; }
    .btn.primary:hover { background: var(--primary-deep); }
    .back-row { display: flex; align-items: center; margin-bottom: 4px; }
    .back-row .back {
      display: flex; align-items: center; gap: 4px;
      font-size: 11.5px; color: var(--text-2); padding: 4px 6px; border-radius: 6px;
    }
    .back-row .back:hover { color: var(--primary); background: rgba(76, 110, 245, 0.08); }
    .back-row .back svg { width: 12px; height: 12px; }

  </style>
</head>
<body>
  <div class="card">
    <!-- 菜单视图 -->
    <div class="menu-view">
      <button class="menu-item" id="menuExpand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="menuExpandIcon"><path d="M6 9l6 6 6-6"/></svg>
        <span id="menuExpandLabel">展开传输详情</span>
      </button>
      <button class="menu-item" id="menuMicro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M8 21H5a2 2 0 0 1-2-2v-3M21 16v3a2 2 0 0 1-2 2h-3"/></svg>
        微型模式
      </button>
      <button class="menu-item" id="menuTransfers">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v13M7 3l-3 3M7 3l3 3M17 21V8M17 21l-3-3M17 21l3-3"/></svg>
        打开传输列表
      </button>
      <button class="menu-item" id="menuToggleTasks" title="全部传输任务开始/暂停">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="menuToggleIcon"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86a1 1 0 0 0-1.5.86z"/></svg>
        <span id="menuToggleLabel">开始全部任务</span>
      </button>
      <button class="menu-item" id="menuSettings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18M3 12h18M3 17h18"/></svg>
        传输设置
      </button>
      <div class="menu-sep"></div>
      <button class="menu-item" id="menuClose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        关闭悬浮窗
      </button>
      <button class="menu-item danger" id="menuQuit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        退出
      </button>
    </div>

    <!-- 简易限速设置视图：与主应用传输设置对话框一致（并行任务数 + 不限速开关 + 数字输入 + KB/s/MB/s） -->
    <div class="settings-view" id="settingsView">
      <div class="back-row">
        <button class="back" id="settingsBack">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          返回
        </button>
      </div>
      <h3>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18M3 12h18M3 17h18"/></svg>
        传输设置
      </h3>

      <div class="sec">
        <div class="sec-title">最大并行任务数 <span class="sub">上传/下载共享</span></div>
        <div class="parallels" id="parallelBtns"></div>
      </div>

      <div class="sec">
        <div class="sec-title">上传限速</div>
        <label class="toggle-row">
          <button type="button" class="switch" id="upSwitch"><span></span></button>
          <span class="toggle-label" id="upToggleLabel">不限速</span>
        </label>
        <div class="input-row" id="upInputRow" style="display:none">
          <input type="number" id="upValue" min="1" placeholder="输入数值" />
          <div class="unit">
            <button type="button" id="upKb" class="active">KB/s</button>
            <button type="button" id="upMb">MB/s</button>
          </div>
        </div>
      </div>

      <div class="sec">
        <div class="sec-title">下载限速</div>
        <label class="toggle-row">
          <button type="button" class="switch" id="downSwitch"><span></span></button>
          <span class="toggle-label" id="downToggleLabel">不限速</span>
        </label>
        <div class="input-row" id="downInputRow" style="display:none">
          <input type="number" id="downValue" min="1" placeholder="输入数值" />
          <div class="unit">
            <button type="button" id="downKb" class="active">KB/s</button>
            <button type="button" id="downMb">MB/s</button>
          </div>
        </div>
      </div>

      <div class="btns">
        <button class="btn primary" id="settingsSave">完成</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';
      const api = window.electronAPI;
      if (!api) {
        document.body.innerHTML = '<div style="color:#8b90a0;padding:30px;font-size:12px;text-align:center">仅支持在桌面客户端中运行</div>';
        return;
      }

      const $ = (id) => document.getElementById(id);
      const ACTIVE = new Set(['pending', 'hashing', 'uploading', 'downloading', 'merging']);
      let tasks = [];
      let toggleMode = 'resume';

      // 主题：跟随主应用 Light / Dark，默认取系统偏好
      function applyDark(isDark) {
        document.documentElement.classList.toggle('dark', !!isDark);
      }
      if (api.onWidgetThemeChanged) api.onWidgetThemeChanged(applyDark);
      try {
        applyDark(window.matchMedia('(prefers-color-scheme: dark)').matches);
      } catch (e) { /* ignore */ }

      function close() {
        if (api.hideMiniMenu) api.hideMiniMenu();
      }

      // 任务状态 → "暂停全部/开始全部"文案与可用性
      function renderToggle() {
        const hasActive = tasks.some(t => ACTIVE.has(t.status));
        const hasPaused = tasks.some(t => t.status === 'paused');
        if (hasActive) {
          toggleMode = 'pause';
          $('menuToggleLabel').textContent = '暂停全部任务';
          $('menuToggleIcon').innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
          $('menuToggleTasks').classList.remove('disabled');
        } else if (hasPaused) {
          toggleMode = 'resume';
          $('menuToggleLabel').textContent = '开始全部任务';
          $('menuToggleIcon').innerHTML = '<path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86a1 1 0 0 0-1.5.86z"/>';
          $('menuToggleTasks').classList.remove('disabled');
        } else {
          toggleMode = 'resume';
          $('menuToggleLabel').textContent = '开始全部任务';
          $('menuToggleIcon').innerHTML = '<path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86a1 1 0 0 0-1.5.86z"/>';
          $('menuToggleTasks').classList.add('disabled');
        }
      }
      function mergeTask(next) {
        const idx = tasks.findIndex(t => t.id === next.id);
        if (idx === -1) tasks.unshift(next);
        else tasks[idx] = next;
        renderToggle();
      }

      api.getTasks().then(all => { tasks = all || []; renderToggle(); }).catch(() => {});
      api.onTaskUpdate(mergeTask);
      // 每次菜单弹出前，主进程通知重置回菜单列表视图
      if (api.onMenuReset) {
        api.onMenuReset(function () {
          document.body.classList.remove('settings');
          renderExpand();
        });
      }

      // ===== 菜单视图 =====
      function renderExpand() {
        if (!api.getWidgetMode) return;
        api.getWidgetMode().then(function (m) {
          const expanded = m === 'expanded';
          $('menuExpandLabel').textContent = expanded ? '收起传输详情' : '展开传输详情';
          $('menuExpandIcon').innerHTML = expanded
            ? '<path d="M6 15l6-6 6 6"/>'
            : '<path d="M6 9l6 6 6-6"/>';
        }).catch(function () {});
      }
      renderExpand();
      $('menuExpand').addEventListener('click', function () {
        if (!api.getWidgetMode) return;
        api.getWidgetMode().then(function (m) {
          api.setWidgetMode(m === 'expanded' ? 'compact' : 'expanded');
        }).catch(function () {});
        close();
      });
      $('menuMicro').addEventListener('click', function () {
        if (api.setWidgetMode) api.setWidgetMode('micro');
        close();
      });
      $('menuTransfers').addEventListener('click', function () {
        api.openTransfers();
        close();
      });
      $('menuToggleTasks').addEventListener('click', function () {
        if ($('menuToggleTasks').classList.contains('disabled')) return;
        if (toggleMode === 'pause') api.pauseAllTransfers();
        else api.resumeAllTransfers();
        close();
      });

      // ===== 简易限速设置（与主应用传输设置对话框一致的交互方式） =====
      const PARALLEL_OPTIONS = [1, 2, 3, 4, 5];
      let settingsState = { maxParallelTasks: 3, uploadSpeedLimit: 0, downloadSpeedLimit: 0 };
      const kindValue = { up: 1, down: 1 };
      const kindUnit = { up: 'mb', down: 'mb' };
      const kindUnlimited = { up: true, down: true };

      // 存储的 KB/s → 显示用 {value, unit}
      function kbToDisplay(kbps) {
        if (kbps === 0) return { value: 1, unit: 'mb' };
        if (kbps >= 1024 && kbps % 1024 === 0) return { value: kbps / 1024, unit: 'mb' };
        return { value: kbps, unit: 'kb' };
      }

      function renderSpeed(kind) {
        const unlimited = kindUnlimited[kind];
        const unit = kindUnit[kind];
        $(kind + 'Value').value = kindValue[kind] || '';
        $(kind + 'Kb').classList.toggle('active', unit === 'kb');
        $(kind + 'Mb').classList.toggle('active', unit === 'mb');
        $(kind + 'Switch').classList.toggle('off', unlimited);
        $(kind + 'ToggleLabel').textContent = unlimited ? '不限速' : '自定义限速';
        $(kind + 'InputRow').style.display = unlimited ? 'none' : 'flex';
      }

      function speedKbps(kind) {
        if (kindUnlimited[kind]) return 0;
        const raw = parseInt($(kind + 'Value').value, 10);
        const v = isNaN(raw) || raw < 1 ? 1 : raw;
        return kindUnit[kind] === 'mb' ? v * 1024 : v;
      }

      ['up', 'down'].forEach(function (kind) {
        $(kind + 'Kb').addEventListener('click', function () { kindUnit[kind] = 'kb'; renderSpeed(kind); });
        $(kind + 'Mb').addEventListener('click', function () { kindUnit[kind] = 'mb'; renderSpeed(kind); });
        $(kind + 'Value').addEventListener('input', function () {
          kindValue[kind] = parseInt(this.value, 10);
        });
        $(kind + 'Switch').addEventListener('click', function () {
          kindUnlimited[kind] = !kindUnlimited[kind];
          renderSpeed(kind);
        });
      });

      $('menuSettings').addEventListener('click', function () {
        if (!api.getTransferSettings) return;
        api.getTransferSettings().then(function (s) {
          if (!s) return;
          settingsState = s;
          // 并行任务数按钮
          const pb = $('parallelBtns');
          pb.innerHTML = '';
          PARALLEL_OPTIONS.forEach(function (n) {
            const b = document.createElement('button');
            b.textContent = String(n);
            b.className = n === (s.maxParallelTasks || 3) ? 'active' : '';
            b.addEventListener('click', function () {
              settingsState = Object.assign({}, settingsState, { maxParallelTasks: n });
              Array.prototype.forEach.call(pb.children, function (x) {
                x.classList.toggle('active', x === b);
              });
            });
            pb.appendChild(b);
          });
          // 上传/下载限速
          ['up', 'down'].forEach(function (kind) {
            const kbps = kind === 'up' ? s.uploadSpeedLimit : s.downloadSpeedLimit;
            const d = kbToDisplay(kbps);
            kindValue[kind] = d.value;
            kindUnit[kind] = d.unit;
            kindUnlimited[kind] = kbps === 0;
            renderSpeed(kind);
          });
          document.body.classList.add('settings');
        }).catch(function () {});
      });
      $('menuClose').addEventListener('click', function () {
        if (api.hideMiniWindow) api.hideMiniWindow();
        close();
      });
      $('menuQuit').addEventListener('click', function () { api.quitApp(); });

      // ===== 简易限速设置视图 =====
      $('settingsBack').addEventListener('click', function () {
        document.body.classList.remove('settings');
      });
      $('settingsSave').addEventListener('click', function () {
        api.setTransferSettings({
          maxParallelTasks: settingsState.maxParallelTasks,
          uploadSpeedLimit: speedKbps('up'),
          downloadSpeedLimit: speedKbps('down'),
        });
        close();
      });
    })();
  </script>
</body>
</html>
