server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: -1

spring:
  profiles:
    active: dev
  application:
    name: st-cloud
  servlet:
    multipart:
      max-file-size: 10GB
      max-request-size: 10GB
      file-size-threshold: 0

# MyBatis-Plus
mybatis-plus:
  # Mapper XML 位置：保留兼容配置；当前 SQL 以注解式为主（含 <script> 动态 SQL），全库暂无 XML Mapper
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.stcloud.**.entity
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 星云盘 自定义配置
stcloud:
  # 租户模式：SAAS-多租户 PRIVATE-单租户
  tenant:
    mode: SAAS
  # JWT 配置
  jwt:
    # 主密钥：仅存环境变量 STCLOUD_MASTER_KEY，不落库不入源码；用于加解密 DB 中的签名密钥
    master-key: ${STCLOUD_MASTER_KEY:}
    # access token 有效期（毫秒），默认 7 天，云盘需要长时间在线不断线
    expiration: 604800000
    # refresh token 有效期（毫秒），默认 30 天
    refresh-expiration: 2592000000
  cors:
    # 允许的前端来源（逗号分隔）；生产必须配置，留空则拒绝所有跨域
    allowed-origins: ${STCLOUD_CORS_ORIGINS:}
  # 对象存储 (RustFS)
  storage:
    endpoint: http://127.0.0.1:9000
    access-key: ${STCLOUD_S3_ACCESS_KEY:stcloud}
    secret-key: ${STCLOUD_S3_SECRET_KEY:stcloud123}
    region: us-east-1
    bucket: stcloud
    chunk-bucket: stcloud-chunks
    preview-bucket: stcloud-preview
  # Elasticsearch 全文搜索
  elasticsearch:
    uris: http://127.0.0.1:9200
    connect-timeout: 5000
    socket-timeout: 30000
  # OnlyOffice 在线编辑（TASK-20260815-onlyoffice-editor-01）
  onlyoffice:
    # 前端 iframe 加载地址（浏览器可达；docker 网络内后端访问 onlyoffice 服务名）
    url: http://localhost:8081
    # 后端对外可达地址（OnlyOffice 容器内用 host.docker.internal 访问宿主；生产改为公网可达地址）
    public-base-url: http://host.docker.internal:8080
    # 签名密钥：HS256 至少 32 字节；开发默认值便于开箱即用，生产必须用环境变量 STCLOUD_ONLYOFFICE_SECRET 覆盖
    jwt-secret: ${STCLOUD_ONLYOFFICE_SECRET:stcloud-onlyoffice-dev-secret-0123456789}
    # 回调下载内容大小上限（字节，默认 200MB），防超大文件投毒
    max-save-size: 209715200
    # 回调 url 下载主机白名单（SSRF 防护）：docker 部署时 onlyoffice 容器以服务名可达
    allowed-callback-hosts: localhost,127.0.0.1,onlyoffice
    # 编辑标记/保存锁后端：redis（默认，多实例一致）/ memory（单实例）
    lock-backend: redis


# Knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

# RocketMQ
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: stcloud-producer
    send-message-timeout: 10000

logging:
  level:
    com.stcloud: debug
    org.springframework.security: info
