server:
  port: 8080
  # 发布时先停止接收新请求，等待在途请求（长下载会被截断，客户端用 Range 续传）
  shutdown: graceful
  servlet:
    context-path: /
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: -1

spring:
  profiles:
    active: dev
  application:
    name: st-cloud
  lifecycle:
    timeout-per-shutdown-phase: 60s
  data:
    redis:
      # 生产缺省超时是 60s，网络黑洞会把 pacing 线程拖死；统一收紧
      timeout: 2s
      connect-timeout: 2s
  servlet:
    multipart:
      max-file-size: 10GB
      max-request-size: 10GB
      file-size-threshold: 0
  # 全局事务默认超时兜底：防止长事务/网络耗时无限占用 DB 连接
  transaction:
    default-timeout: 30s

# MyBatis-Plus
mybatis-plus:
  # Mapper XML 位置：保留兼容配置；当前 SQL 以注解式为主（含 <script> 动态 SQL），全库暂无 XML Mapper
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.stcloud.**.entity
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 星云盘 自定义配置
stcloud:
  # 租户模式：SAAS-多租户 PRIVATE-单租户
  tenant:
    mode: SAAS
  # JWT 配置
  jwt:
    # 主密钥：仅存环境变量 STCLOUD_MASTER_KEY，不落库不入源码；用于加解密 DB 中的签名密钥
    master-key: ${STCLOUD_MASTER_KEY:}
    # access token 有效期（毫秒），默认 7 天，云盘需要长时间在线不断线
    expiration: 604800000
    # refresh token 有效期（毫秒），默认 30 天
    refresh-expiration: 2592000000

  # 传输限速：local=进程内（仅单节点）；redis=本地 8KB 平滑 + Redis 全局信用
  rate-limit:
    mode: ${STCLOUD_RATE_LIMIT_MODE:local}
    quantum-ms: 100
    quantum-min-bytes: 65536
    quantum-max-bytes: 1048576
    key-ttl-ms: 600000
    fail-open: true
    upload-window: 1

  # 对象存储 (RustFS)
  storage:
    # 服务端内部读写地址：容器部署走服务网络（http://rustfs:9000），本地开发用 127.0.0.1
    endpoint: ${STCLOUD_STORAGE_ENDPOINT:http://127.0.0.1:9000}
    # 对外预签名地址：必须是浏览器/客户端可达的地址，留空回退 endpoint。
    # 拆分原因：容器经宿主机 NAT 回环读写 S3 只有约 4MB/s，直连服务网络后 40MB 下载约 18.6MB/s。
    public-endpoint: ${STCLOUD_STORAGE_PUBLIC_ENDPOINT:}
    access-key: ${STCLOUD_S3_ACCESS_KEY:stcloud}
    secret-key: ${STCLOUD_S3_SECRET_KEY:stcloud123}
    region: us-east-1
    bucket: stcloud
    chunk-bucket: stcloud-chunks
    preview-bucket: stcloud-preview
  # Elasticsearch 全文搜索
  elasticsearch:
    uris: http://127.0.0.1:9200
    connect-timeout: 5000
    socket-timeout: 30000
  # OnlyOffice 在线编辑（TASK-20260815-onlyoffice-editor-01）
  onlyoffice:
    # 前端 iframe 加载地址（浏览器可达；docker 网络内后端访问 onlyoffice 服务名）
    url: http://localhost:8081
    # 后端对外可达地址（OnlyOffice 容器内用 host.docker.internal 访问宿主；生产改为公网可达地址）
    public-base-url: http://host.docker.internal:8080
    # 签名密钥：HS256 至少 32 字节；开发默认值便于开箱即用，生产必须用环境变量 STCLOUD_ONLYOFFICE_SECRET 覆盖
    jwt-secret: ${STCLOUD_ONLYOFFICE_SECRET:stcloud-onlyoffice-dev-secret-0123456789}
    # 回调下载内容大小上限（字节，默认 200MB），防超大文件投毒
    max-save-size: 209715200
    # 回调 url 下载主机白名单（SSRF 防护）：docker 部署时 onlyoffice 容器以服务名可达
    allowed-callback-hosts: localhost,127.0.0.1,onlyoffice
    # 编辑标记/保存锁后端：redis（默认，多实例一致）/ memory（单实例）
    lock-backend: redis


# Knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

# RocketMQ
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: stcloud-producer
    send-message-timeout: 10000

logging:
  level:
    com.stcloud: info
    org.springframework.security: info
