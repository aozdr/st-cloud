# Clean Codex project configuration for st-cloud
# Removed legacy/unsafe permission-mode settings such as:
#   [windows]
#   sandbox = "elevated"
#
# The project is trusted below. Codex will use its default permission/sandbox mode.

model_reasoning_summary = "auto"
[projects.'e:\code\st-cloud']
trust_level = "trusted"

[desktop]
followUpQueueMode = "queue"

[plugins."browser@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[features]
js_repl = false
