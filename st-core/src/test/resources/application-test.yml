spring:
  main:
    web-application-type: none
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:stcloud-test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.stcloud.**.entity
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

stcloud:
  tenant:
    mode: SAAS
  onlyoffice:
    # 测试环境使用内存锁后端，避免依赖 Redis；生产默认 redis
    lock-backend: memory
    jwt-secret: test-onlyoffice-secret-0123456789abcdef
    url: http://localhost:8081
    public-base-url: http://localhost:8080
    allowed-callback-hosts: localhost,127.0.0.1
