spring:
  main:
    web-application-type: none
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:stauth-test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.stcloud.**.entity
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

stcloud:
  tenant:
    mode: SAAS
  jwt:
    # 测试用主密钥（≥32 字节），仅用于集成测试环境
    master-key: stcloud-test-master-key-0123456789abcdef
    expiration: 604800000
    refresh-expiration: 2592000000
    download-expiration: 300000
